services:
  # 1. PostGIS Database
  db:
    image: postgis/postgis:16-3.4
    container_name: geoafya_db
    restart: always
    environment:
      POSTGRES_DB: geoafya_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geoafya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: geoafya_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. GeoDjango REST API Web Service
  web:
    build: .
    container_name: geoafya_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgis://postgres:postgrespassword@db:5432/geoafya_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=GeoAfya.settings
      - DB_SSL_REQUIRE=False
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Task Worker (Heavy GIS & Alerts Queues)
  celery_worker:
    build: .
    container_name: geoafya_worker
    restart: always
    command: celery -A GeoAfya worker -l info -Q default,heavy_gis,alerts -c 4
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgis://postgres:postgrespassword@db:5432/geoafya_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=GeoAfya.settings
      - DB_SSL_REQUIRE=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Celery Beat Periodic Scheduler
  celery_beat:
    build: .
    container_name: geoafya_beat
    restart: always
    command: celery -A GeoAfya beat -l info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgis://postgres:postgrespassword@db:5432/geoafya_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=GeoAfya.settings
      - DB_SSL_REQUIRE=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: